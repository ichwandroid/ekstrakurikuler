<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0d0d14">
    <title>Scanner QR Presensi</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0d0d14;
            --surface: #15151f;
            --lime: #c8f731;
            --white: #fff;
            --muted: rgba(255, 255, 255, .55);
            --danger: #ff8a8a;
            --border: rgba(255, 255, 255, .1)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 28px;
            background: var(--bg);
            color: var(--white);
            font-family: Arial, sans-serif
        }

        main {
            width: min(100%, 1080px);
            margin: auto
        }

        .badge {
            color: var(--lime);
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase
        }

        h1 {
            margin: 8px 0 4px;
            font-size: 1.8rem
        }

        .intro {
            margin: 0 0 20px;
            color: var(--muted);
            font-size: .88rem
        }

        .dashboard {
            display: grid;
            grid-template-columns: minmax(0, 1.25fr) minmax(300px, .75fr);
            gap: 20px;
            align-items: start
        }

        .card {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--surface)
        }

        #reader {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-height: min(62vh, 620px);
            min-height: 0;
            background: #000
        }

        #reader video {
            width: 100% !important;
            height: 100% !important;
            display: block;
            object-fit: cover
        }

        #reader__dashboard {
            display: none !important
        }

        .status {
            padding: 16px 18px;
            color: var(--muted);
            font-size: .86rem
        }

        .status.error {
            color: var(--danger)
        }

        button {
            width: 100%;
            margin-top: 14px;
            padding: 15px;
            border: 0;
            border-radius: 16px;
            cursor: pointer;
            background: var(--lime);
            color: #0d0d14;
            font-weight: 800;
            font-size: .9rem
        }

        .camera-controls {
            display: flex;
            gap: 10px;
        }

        .camera-controls button {
            flex: 1;
            width: auto;
            margin-top: 14px;
        }

        .camera-select {
            flex: 1;
            min-width: 0;
            margin-top: 14px;
            padding: 15px 12px;
            border: 1px solid rgba(200, 247, 49, .4);
            border-radius: 16px;
            background: var(--surface);
            color: var(--white);
            font: inherit;
        }

        .camera-switch {
            background: var(--surface);
            color: var(--lime);
            border: 1px solid rgba(200, 247, 49, .4);
        }
        .manual-box {
            margin-top: 14px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--surface);
        }
        .manual-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 12px;
        }
        .manual-head span {
            font-size: .84rem;
            font-weight: 700;
            color: var(--white);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .manual-head small {
            font-size: .72rem;
            color: var(--muted);
        }
        .manual-row {
            display: flex;
            gap: 10px;
        }
        .manual-input {
            flex: 1;
            min-width: 0;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: #0d0d14;
            color: var(--white);
            font: inherit;
            font-size: .9rem;
            text-transform: uppercase;
            letter-spacing: .04em;
            outline: none;
            transition: border-color .2s;
        }
        .manual-input:focus {
            border-color: var(--lime);
        }
        .manual-btn {
            width: auto;
            margin: 0;
            padding: 13px 18px;
            border-radius: 14px;
            white-space: nowrap;
            font-size: .86rem;
        }
        .manual-hint {
            margin-top: 8px;
            font-size: .75rem;
            color: var(--lime);
            min-height: 16px;
        }
        .btn-clear-history {
            width: auto;
            margin: 0;
            padding: 4px 9px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            font-size: .7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
        }
        .btn-clear-history:hover {
            color: var(--danger);
            border-color: var(--danger);
        }
        .dashboard-modal { display:none; position:fixed; inset:0; z-index:20; padding:24px; background:rgba(13,13,20,.84); backdrop-filter:blur(8px); }
        .dashboard-modal.show { display:grid; place-items:center; }
        .dashboard-panel { width:min(100%,620px); max-height:85vh; overflow:auto; padding:20px; border:1px solid var(--border); border-radius:24px; background:var(--surface); }
        .dashboard-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
        .dashboard-top h2 { margin:0; font-size:1.15rem; }
        .dashboard-close { width:auto; margin:0; padding:9px 13px; background:var(--surface); color:var(--white); border:1px solid var(--border); }
        .dashboard-total { padding:16px; margin-bottom:12px; border-radius:16px; background:rgba(200,247,49,.12); color:var(--lime); font-size:1.5rem; font-weight:800; }
        .dashboard-total small { display:block; margin-top:3px; color:var(--muted); font-size:.75rem; font-weight:600; }
        .dashboard-refresh { margin:0 0 12px; padding:11px; }
        .dashboard-empty { padding:26px 6px; color:var(--muted); text-align:center; }
        .dashboard-filter { display:flex; gap:10px; margin-bottom:14px; }
        .dashboard-filter input { flex:1; min-width:0; padding:11px 12px; border:1px solid var(--border); border-radius:12px; background:var(--surface); color:var(--white); font:inherit; }
        .dashboard-filter button { width:auto; margin:0; padding:11px 16px; }
        .dashboard-stats { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:14px; }
        .dashboard-stat { padding:12px 8px; border-radius:14px; background:rgba(255,255,255,.04); text-align:center; }
        .dashboard-stat strong { display:block; font-size:1.25rem; color:var(--lime); }
        .dashboard-stat span { display:block; margin-top:3px; color:var(--muted); font-size:.66rem; }
        .dashboard-chart { height:210px; margin:10px 0 18px; }
        .dashboard-chart canvas { width:100% !important; height:100% !important; }
        .dashboard-table-wrap { overflow:auto; border:1px solid var(--border); border-radius:14px; }
        .dashboard-table { width:100%; border-collapse:collapse; min-width:480px; font-size:.74rem; }
        .dashboard-table th, .dashboard-table td { padding:10px; text-align:left; border-bottom:1px solid var(--border); }
        .dashboard-table th { color:var(--muted); font-weight:600; }
        .dashboard-table tr:last-child td { border-bottom:0; }
        .status-hadir { color:var(--lime); }
        .status-izin { color:#ffd166; }
        .status-sakit { color:#8ec5ff; }
        .status-alpa { color:var(--danger); }

        .history-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px;
            border-bottom: 1px solid var(--border)
        }

        .history-head h2 {
            margin: 0;
            font-size: 1rem
        }

        .count {
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(200, 247, 49, .12);
            color: var(--lime);
            font-size: .74rem;
            font-weight: 700
        }

        .history-list {
            max-height: 440px;
            margin: 0;
            padding: 4px 18px;
            overflow: auto;
            list-style: none
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 0;
            border-bottom: 1px solid var(--border)
        }

        .history-item:last-child {
            border: 0
        }

        .history-icon {
            display: grid;
            flex: 0 0 32px;
            width: 32px;
            height: 32px;
            place-items: center;
            border-radius: 10px;
            background: rgba(200, 247, 49, .12);
            color: var(--lime);
            font-weight: 800
        }

        .history-main {
            flex: 1;
            min-width: 0
        }

        .history-name {
            overflow: hidden;
            font-size: .87rem;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .history-detail,
        .history-time {
            color: var(--muted);
            font-size: .72rem
        }

        .history-detail {
            margin-top: 3px
        }

        .history-time {
            white-space: nowrap
        }

        .history-empty {
            padding: 34px 8px;
            color: var(--muted);
            text-align: center;
            font-size: .83rem
        }

        .toast {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 10;
            max-width: 340px;
            padding: 14px 16px;
            border-radius: 14px;
            background: var(--lime);
            color: #10130b;
            font-size: .84rem;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
            opacity: 0;
            transform: translateY(16px);
            transition: .25s
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0)
        }

        .toast.error {
            background: var(--danger);
            color: #2d0808
        }

        @media(max-width:700px) {
            body {
                padding: 18px
            }

            .dashboard {
                grid-template-columns: 1fr
            }

            h1 {
                font-size: 1.5rem
            }

            .history-list {
                max-height: 260px
            }

            #reader {
                max-height: none;
            }

            .toast {
                right: 18px;
                bottom: 18px;
                left: 18px;
                max-width: none
            }
        }
    </style>
</head>

<body>
    <div class="toast" id="toast"></div>
    <div class="dashboard-modal" id="dashboardModal" role="dialog" aria-modal="true" aria-labelledby="dashboardTitle">
        <div class="dashboard-panel">
            <div class="dashboard-top"><h2 id="dashboardTitle">Dashboard Siswa</h2><button class="dashboard-close" type="button" onclick="closeDashboard()">Tutup</button></div>
            <div class="dashboard-filter"><input id="dashboardDate" type="date"><button class="dashboard-refresh" type="button" onclick="loadDashboard()">Refresh</button></div>
            <div class="dashboard-stats">
                <div class="dashboard-stat"><strong id="statTotal">0</strong><span>Total</span></div>
                <div class="dashboard-stat"><strong id="statHadir">0</strong><span>Hadir</span></div>
                <div class="dashboard-stat"><strong id="statIzin">0</strong><span>Izin</span></div>
                <div class="dashboard-stat"><strong id="statSakit">0</strong><span>Sakit</span></div>
                <div class="dashboard-stat"><strong id="statAlpa">0</strong><span>Alpa</span></div>
            </div>
            <div class="dashboard-chart"><canvas id="attendanceChart"></canvas></div>
            <div class="dashboard-table-wrap"><table class="dashboard-table"><thead><tr><th>Siswa</th><th>Guru</th><th>Kegiatan</th><th>Status</th></tr></thead><tbody id="dashboardTable"></tbody></table></div>
        </div>
    </div>
    <main>
        <div class="badge">Scanner Admin</div>
        <h1>Pindai QR Peserta</h1>
        <p class="intro">Mode tablet - kamera dan riwayat scan ditampilkan bersamaan.</p>
        <div class="dashboard">
            <section>
                <div class="card">
                    <div id="reader"></div>
                    <div class="status" id="status">Menyiapkan kamera...</div>
                </div>
                <div class="camera-controls">
                    <button id="dashboardButton" class="camera-switch" type="button" onclick="openDashboard()">Dashboard</button>
                    <select id="cameraSelect" class="camera-select" aria-label="Pilih kamera" onchange="changeCamera(this.value)" hidden></select>
                    <button id="retryButton" type="button" onclick="startScanner()" style="display:none">Coba Lagi</button>
                </div>

                <!-- Input Manual ID User jika QR Bermasalah -->
                <div class="manual-box">
                    <div class="manual-head">
                        <span>⌨ Input Kode ID User</span>
                        <small>Gunakan jika QR bermasalah/rusak</small>
                    </div>
                    <form id="manualForm" onsubmit="submitManualId(event)">
                        <div class="manual-row">
                            <input id="manualIdInput" class="manual-input" type="text" list="userIdDatalist" placeholder="Contoh: USR-001" autocomplete="off" autocorrect="off" autocapitalize="characters" />
                            <datalist id="userIdDatalist"></datalist>
                            <button id="manualSubmitBtn" class="manual-btn" type="submit">Catat Hadir</button>
                        </div>
                        <div class="manual-hint" id="manualHint"></div>
                    </form>
                </div>
            </section>
            <aside class="card">
                <div class="history-head">
                    <h2>Scan Terkini</h2>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span class="count" id="scanCount">0</span>
                        <button class="btn-clear-history" type="button" title="Bersihkan riwayat hari ini" onclick="clearScanHistory()">Reset</button>
                    </div>
                </div>
                <ul class="history-list" id="historyList"></ul>
            </aside>
        </div>
    </main>
    <script>
        let scanner = null;
        let scanning = false;
        let isProcessing = false;
        let toastTimer = null;
        let cameras = [];
        let activeCameraIndex = 0;
        let attendanceChart = null;
        let usersCache = [];

        const statusEl = document.getElementById('status');
        const retryButton = document.getElementById('retryButton');
        const cameraSelect = document.getElementById('cameraSelect');
        const historyList = document.getElementById('historyList');
        const scanCount = document.getElementById('scanCount');
        const toast = document.getElementById('toast');
        const dashboardModal = document.getElementById('dashboardModal');
        const dashboardDate = document.getElementById('dashboardDate');
        const manualIdInput = document.getElementById('manualIdInput');
        const manualSubmitBtn = document.getElementById('manualSubmitBtn');
        const manualHint = document.getElementById('manualHint');

        const backendUrl = 'https://script.google.com/macros/s/AKfycbxyqt4qTJ7-wNBPU5dK9PaQRlu6txl4l7NaaHbFkKRyntQrnByJCnW09PuY8UNeaEO7rA/exec';
        const historyKey = 'absensi-ekstra-scan-history-v2';

        function getTodayStr() {
            return new Date().toISOString().slice(0, 10);
        }

        let scanHistory = (function() {
            try {
                const stored = JSON.parse(localStorage.getItem(historyKey) || '[]');
                return Array.isArray(stored) ? stored.filter(item => item && item.id) : [];
            } catch (e) {
                return [];
            }
        })();

        function setStatus(message, isError) {
            statusEl.textContent = message;
            statusEl.className = 'status' + (isError ? ' error' : '');
        }

        function notify(message, isError) {
            clearTimeout(toastTimer);
            toast.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : '');
            toastTimer = setTimeout(() => { toast.className = 'toast'; }, 3200);
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            }[char]));
        }

        function getData(payload) {
            try { return typeof payload === 'object' ? payload : JSON.parse(payload); }
            catch (error) { return {}; }
        }

        function playBeep(isSuccess = true) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                if (isSuccess) {
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    gain.gain.setValueAtTime(0.18, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                } else {
                    osc.frequency.setValueAtTime(260, ctx.currentTime);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                }
                if (navigator.vibrate) {
                    navigator.vibrate(isSuccess ? [80] : [120, 80, 120]);
                }
            } catch (e) { }
        }

        function renderHistory() {
            const today = getTodayStr();
            const todayHistory = scanHistory.filter(item => item.date === today);
            scanCount.textContent = todayHistory.length;

            if (!todayHistory.length) {
                historyList.innerHTML = '<li class="history-empty">Belum ada data presensi hari ini.</li>';
                return;
            }

            historyList.innerHTML = todayHistory.map(item => {
                const iconLabel = item.isManual ? 'MAN' : 'OK';
                const badgeStyle = item.isManual
                    ? 'style="background:rgba(142,197,255,.15);color:#8ec5ff;"'
                    : '';
                const desc = item.isManual ? 'Manual ID - Berhasil dicatat' : (escapeHtml(item.role) + ' - Berhasil via QR');
                return '<li class="history-item">' +
                    '<span class="history-icon" ' + badgeStyle + '>' + iconLabel + '</span>' +
                    '<div class="history-main">' +
                    '<div class="history-name">' + escapeHtml(item.name) + ' (' + escapeHtml(item.id) + ')</div>' +
                    '<div class="history-detail">' + desc + '</div>' +
                    '</div>' +
                    '<span class="history-time">' + escapeHtml(item.time) + '</span>' +
                    '</li>';
            }).join('');
        }

        function addToHistory(itemData) {
            const data = getData(itemData);
            const id = String(data.id || '').toUpperCase();
            scanHistory.unshift({
                id: id,
                name: data.nama || 'Peserta',
                role: data.jabatan || 'Guru',
                time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                date: getTodayStr(),
                isManual: !!data.isManual
            });
            scanHistory = scanHistory.slice(0, 100);
            try { localStorage.setItem(historyKey, JSON.stringify(scanHistory)); } catch (e) { }
            renderHistory();
        }

        function clearScanHistory() {
            const today = getTodayStr();
            const todayCount = scanHistory.filter(item => item.date === today).length;
            if (!todayCount) {
                notify('Riwayat hari ini masih kosong.');
                return;
            }
            if (!confirm('Bersihkan riwayat scan presensi hari ini pada perangkat ini?')) return;
            scanHistory = scanHistory.filter(item => item.date !== today);
            try { localStorage.setItem(historyKey, JSON.stringify(scanHistory)); } catch (e) { }
            renderHistory();
            notify('Riwayat hari ini telah dibersihkan.');
        }

        function enableContinuousFocus() {
            if (!scanner || typeof scanner.applyVideoConstraints !== 'function') return Promise.resolve();
            return scanner.applyVideoConstraints({ advanced: [{ focusMode: 'continuous' }] })
                .catch(() => scanner.applyVideoConstraints({ focusMode: 'continuous' }))
                .catch(() => { });
        }

        function startCamera() {
            if (!scanner) {
                scanner = new Html5Qrcode('reader');
            }
            const camera = cameras[activeCameraIndex];
            const cameraConfig = camera && camera.id
                ? { deviceId: { exact: camera.id } }
                : { facingMode: 'environment' };

            return scanner.start(
                cameraConfig,
                { fps: 15, qrbox: { width: 320, height: 320 } },
                onScanSuccess,
                () => { }
            ).then(() => enableContinuousFocus());
        }

        function renderCameraOptions() {
            cameraSelect.innerHTML = cameras.map((camera, index) =>
                '<option value="' + index + '">' + escapeHtml(camera.label || ('Kamera ' + (index + 1))) + '</option>'
            ).join('');
            cameraSelect.value = String(activeCameraIndex);
            cameraSelect.hidden = cameras.length < 2;
        }

        function changeCamera(index) {
            const nextIndex = Number(index);
            if (!Number.isInteger(nextIndex) || !cameras[nextIndex] || nextIndex === activeCameraIndex) return;
            activeCameraIndex = nextIndex;
            if (!scanning || !scanner) return;
            scanning = false;
            setStatus('Mengganti kamera...');
            scanner.stop().catch(() => { }).then(() => startCamera()).then(() => {
                scanning = true;
                setStatus('Kamera aktif - arahkan ke QR Code peserta.');
            }).catch(error => {
                setStatus('Kamera tidak dapat digunakan: ' + error, true);
                retryButton.style.display = 'block';
            });
        }

        function startScanner() {
            if (scanning) return;
            retryButton.style.display = 'none';
            setStatus('Meminta akses kamera...');

            Html5Qrcode.getCameras().then(foundCameras => {
                if (!foundCameras.length) throw new Error('Tidak ada kamera yang terdeteksi.');
                cameras = foundCameras;
                const rearIndex = cameras.findIndex(camera => /back|rear|environment|belakang/i.test(camera.label || ''));
                if (!cameraSelect.value) activeCameraIndex = rearIndex >= 0 ? rearIndex : 0;
                renderCameraOptions();
                return startCamera();
            }).then(() => {
                scanning = true;
                setStatus('Kamera aktif - arahkan ke QR Code peserta.');
            }).catch(error => {
                setStatus('Kamera tidak dapat digunakan: ' + error + '. Anda dapat menggunakan opsi Input ID Manual di bawah.', true);
                retryButton.style.display = 'block';
            });
        }

        function onScanSuccess(decodedText) {
            if (isProcessing) return;

            let data = getData(decodedText);
            const id = String(data.id || decodedText).trim().toUpperCase();

            // Client-side validation: QR timestamp (max 5 minutes)
            if (data.timestamp) {
                const qrTime = new Date(data.timestamp).getTime();
                if (!isNaN(qrTime) && (Date.now() - qrTime) > 5 * 60 * 1000) {
                    playBeep(false);
                    notify('QR Code sudah kedaluwarsa (> 5 menit). Minta user generate ulang.', true);
                    return;
                }
            }

            // Duplicate check today
            const today = getTodayStr();
            if (scanHistory.some(item => String(item.id).toUpperCase() === id && item.date === today)) {
                playBeep(false);
                notify((data.nama || id) + ' sudah tercatat hadir hari ini.', true);
                return;
            }

            // Match cached user if name is missing
            const matchedUser = usersCache.find(u => String(u.id).toUpperCase() === id);
            if (matchedUser && !data.nama) {
                data.nama = matchedUser.nama;
                data.jabatan = matchedUser.jabatan;
            }

            isProcessing = true;
            playBeep(true);
            setStatus('QR terbaca: ' + (data.nama || id) + '. Menyimpan presensi...');

            fetch(backendUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'recordPresensi', payload: decodedText })
            }).then(() => {
                addToHistory(data);
                notify((data.nama || id) + ' berhasil dicatat hadir!');
                setStatus('Data terkirim. Siap scan peserta berikutnya.');
                setTimeout(() => { isProcessing = false; }, 1800);
            }).catch(err => {
                playBeep(false);
                setStatus('Data gagal dikirim. Periksa koneksi internet.', true);
                notify('Data gagal dikirim. Silakan coba lagi atau gunakan input manual.', true);
                isProcessing = false;
            });
        }

        // ─── Manual ID Submission ───
        function submitManualId(e) {
            if (e) e.preventDefault();
            const id = manualIdInput.value.trim().toUpperCase();
            if (!id) {
                notify('Silakan ketik kode ID User.', true);
                manualIdInput.focus();
                return;
            }

            const today = getTodayStr();
            if (scanHistory.some(item => String(item.id).toUpperCase() === id && item.date === today)) {
                playBeep(false);
                notify('ID ' + id + ' sudah tercatat hadir hari ini.', true);
                return;
            }

            const matchedUser = usersCache.find(u => String(u.id).toUpperCase() === id);
            const nama = matchedUser ? matchedUser.nama : id;
            const jabatan = matchedUser ? (matchedUser.jabatan || 'Guru') : 'Peserta';

            const payloadObj = {
                id: id,
                nama: nama,
                jabatan: jabatan,
                token: 'MANUAL_' + Date.now(),
                timestamp: new Date().toISOString(),
                isManual: true
            };

            manualSubmitBtn.disabled = true;
            manualSubmitBtn.textContent = 'Menyimpan...';
            setStatus('Menyimpan presensi manual untuk ' + nama + ' (' + id + ')...');

            fetch(backendUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'recordPresensi',
                    payload: JSON.stringify(payloadObj)
                })
            }).then(() => {
                manualSubmitBtn.disabled = false;
                manualSubmitBtn.textContent = 'Catat Hadir';
                manualIdInput.value = '';
                manualHint.textContent = '';
                playBeep(true);
                addToHistory(payloadObj);
                notify('Presensi ' + nama + ' (' + id + ') berhasil dicatat!');
                setStatus('Presensi manual berhasil. Siap scan atau input lagi.');
            }).catch(err => {
                manualSubmitBtn.disabled = false;
                manualSubmitBtn.textContent = 'Catat Hadir';
                playBeep(false);
                setStatus('Gagal menyimpan presensi manual. Periksa koneksi.', true);
                notify('Gagal menyimpan presensi manual.', true);
            });
        }

        manualIdInput.addEventListener('input', function() {
            const val = this.value.trim().toUpperCase();
            if (!val) {
                manualHint.textContent = '';
                return;
            }
            const match = usersCache.find(u => String(u.id).toUpperCase() === val);
            if (match) {
                manualHint.textContent = '✓ ' + match.nama + ' (' + (match.jabatan || 'Guru') + ')';
                manualHint.style.color = 'var(--lime)';
            } else if (usersCache.length > 0) {
                manualHint.textContent = 'ID tidak ditemukan dalam daftar nama.';
                manualHint.style.color = 'var(--muted)';
            } else {
                manualHint.textContent = '';
            }
        });

        // ─── Users List Cache (JSONP) ───
        function loadUsersList() {
            const old = document.getElementById('usersJsonp');
            if (old) old.remove();
            const script = document.createElement('script');
            script.id = 'usersJsonp';
            script.src = backendUrl + '?api=users&callback=onUsersLoaded&_=' + Date.now();
            script.onerror = () => { };
            document.body.appendChild(script);
        }

        function onUsersLoaded(users) {
            if (Array.isArray(users)) {
                usersCache = users;
                const datalist = document.getElementById('userIdDatalist');
                if (datalist) {
                    datalist.innerHTML = users.map(u =>
                        '<option value="' + escapeHtml(u.id) + '">' + escapeHtml(u.nama) + ' (' + escapeHtml(u.jabatan || 'Guru') + ')</option>'
                    ).join('');
                }
            }
        }

        // ─── Dashboard Modal ───
        function openDashboard() {
            dashboardModal.classList.add('show');
            if (!dashboardDate.value) dashboardDate.value = getTodayStr();
            loadDashboard();
        }

        function closeDashboard() {
            dashboardModal.classList.remove('show');
        }

        function loadDashboard() {
            const old = document.getElementById('dashboardJsonp');
            if (old) old.remove();
            const script = document.createElement('script');
            script.id = 'dashboardJsonp';
            script.src = backendUrl + '?api=dashboard&date=' + encodeURIComponent(dashboardDate.value) + '&callback=onDashboardData&_=' + Date.now();
            script.onerror = () => notify('Gagal memuat dashboard.', true);
            document.body.appendChild(script);
        }

        function onDashboardData(data) {
            const stats = data.stats || {};
            document.getElementById('statTotal').textContent = data.total || 0;
            document.getElementById('statHadir').textContent = stats.Hadir || 0;
            document.getElementById('statIzin').textContent = stats.Izin || 0;
            document.getElementById('statSakit').textContent = stats.Sakit || 0;
            document.getElementById('statAlpa').textContent = stats.Alpa || 0;
            renderAttendanceChart(data);
            renderAttendanceTable(data.records || []);
        }

        function renderAttendanceChart(data) {
            const context = document.getElementById('attendanceChart').getContext('2d');
            if (attendanceChart) attendanceChart.destroy();
            attendanceChart = new Chart(context, {
                type: 'bar',
                data: {
                    labels: ['Hadir', 'Izin', 'Sakit', 'Alpa'],
                    datasets: [{
                        data: [data.stats.Hadir || 0, data.stats.Izin || 0, data.stats.Sakit || 0, data.stats.Alpa || 0],
                        backgroundColor: ['#c8f731', '#ffd166', '#8ec5ff', '#ff8a8a'],
                        borderRadius: 8,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, ticks: { color: '#9a9aa9', precision: 0 }, grid: { color: 'rgba(255,255,255,.07)' } },
                        x: { ticks: { color: '#fff' }, grid: { display: false } }
                    }
                }
            });
        }

        function renderAttendanceTable(records) {
            const table = document.getElementById('dashboardTable');
            table.innerHTML = records.length ? records.map(item =>
                '<tr><td>' + escapeHtml(item.siswa) + '<br><small>' + escapeHtml(item.kelas) + '</small></td>' +
                '<td>' + escapeHtml(item.guru) + '</td>' +
                '<td>' + escapeHtml(item.kegiatan) + '</td>' +
                '<td class="status-' + String(item.status).toLowerCase() + '">' + escapeHtml(item.status) + '</td></tr>'
            ).join('') : '<tr><td colspan="4" class="dashboard-empty">Belum ada absensi manual pada tanggal ini.</td></tr>';
        }

        renderHistory();
        loadUsersList();
        startScanner();
    </script>
</body>

</html>
