<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0d0d14">
    <title>Scanner QR Presensi</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --bg: #0d0d14;
            --surface: #15151f;
            --lime: #c8f731;
            --white: #fff;
            --muted: rgba(255, 255, 255, .55);
            --danger: #ff8a8a;
            --border: rgba(255, 255, 255, .1)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 28px;
            background: var(--bg);
            color: var(--white);
            font-family: Arial, sans-serif
        }

        main {
            width: min(100%, 1080px);
            margin: auto
        }

        .badge {
            color: var(--lime);
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase
        }

        h1 {
            margin: 8px 0 4px;
            font-size: 1.8rem
        }

        .intro {
            margin: 0 0 20px;
            color: var(--muted);
            font-size: .88rem
        }

        .dashboard {
            display: grid;
            grid-template-columns: minmax(0, 1.25fr) minmax(300px, .75fr);
            gap: 20px;
            align-items: start
        }

        .card {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--surface)
        }

        #reader {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-height: min(62vh, 620px);
            min-height: 0;
            background: #000
        }

        #reader video {
            width: 100% !important;
            height: 100% !important;
            display: block;
            object-fit: cover
        }

        #reader__dashboard {
            display: none !important
        }

        .status {
            padding: 16px 18px;
            color: var(--muted);
            font-size: .86rem
        }

        .status.error {
            color: var(--danger)
        }

        button {
            width: 100%;
            margin-top: 14px;
            padding: 15px;
            border: 0;
            border-radius: 16px;
            cursor: pointer;
            background: var(--lime);
            color: #0d0d14;
            font-weight: 800;
            font-size: .9rem
        }

        .camera-controls {
            display: flex;
            gap: 10px;
        }

        .camera-controls button {
            margin-top: 14px;
        }

        .camera-switch {
            background: var(--surface);
            color: var(--lime);
            border: 1px solid rgba(200, 247, 49, .4);
        }

        .history-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px;
            border-bottom: 1px solid var(--border)
        }

        .history-head h2 {
            margin: 0;
            font-size: 1rem
        }

        .count {
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(200, 247, 49, .12);
            color: var(--lime);
            font-size: .74rem;
            font-weight: 700
        }

        .history-list {
            max-height: 440px;
            margin: 0;
            padding: 4px 18px;
            overflow: auto;
            list-style: none
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 0;
            border-bottom: 1px solid var(--border)
        }

        .history-item:last-child {
            border: 0
        }

        .history-icon {
            display: grid;
            flex: 0 0 32px;
            width: 32px;
            height: 32px;
            place-items: center;
            border-radius: 10px;
            background: rgba(200, 247, 49, .12);
            color: var(--lime);
            font-weight: 800
        }

        .history-main {
            flex: 1;
            min-width: 0
        }

        .history-name {
            overflow: hidden;
            font-size: .87rem;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .history-detail,
        .history-time {
            color: var(--muted);
            font-size: .72rem
        }

        .history-detail {
            margin-top: 3px
        }

        .history-time {
            white-space: nowrap
        }

        .history-empty {
            padding: 34px 8px;
            color: var(--muted);
            text-align: center;
            font-size: .83rem
        }

        .toast {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 10;
            max-width: 340px;
            padding: 14px 16px;
            border-radius: 14px;
            background: var(--lime);
            color: #10130b;
            font-size: .84rem;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
            opacity: 0;
            transform: translateY(16px);
            transition: .25s
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0)
        }

        .toast.error {
            background: var(--danger);
            color: #2d0808
        }

        @media(max-width:700px) {
            body {
                padding: 18px
            }

            .dashboard {
                grid-template-columns: 1fr
            }

            h1 {
                font-size: 1.5rem
            }

            .history-list {
                max-height: 260px
            }

            #reader {
                max-height: none;
            }

            .toast {
                right: 18px;
                bottom: 18px;
                left: 18px;
                max-width: none
            }
        }
    </style>
</head>

<body>
    <div class="toast" id="toast"></div>
    <main>
        <div class="badge">Scanner Admin</div>
        <h1>Pindai QR Peserta</h1>
        <p class="intro">Mode tablet - kamera dan riwayat scan ditampilkan bersamaan.</p>
        <div class="dashboard">
            <section>
                <div class="card">
                    <div id="reader"></div>
                    <div class="status" id="status">Menyiapkan kamera...</div>
                </div>
                <div class="camera-controls">
                    <button id="switchCameraButton" class="camera-switch" type="button" onclick="switchCamera()"
                        style="display:none">Ganti Kamera</button>
                    <button id="retryButton" type="button" onclick="startScanner()" style="display:none">Coba
                        Lagi</button>
                </div>
            </section>
            <aside class="card">
                <div class="history-head">
                    <h2>Scan Terkini</h2><span class="count" id="scanCount">0</span>
                </div>
                <ul class="history-list" id="historyList"></ul>
            </aside>
        </div>
    </main>
    <script>
        let scanner, scanning = false, delivered = false, toastTimer, cameras = [], activeCameraIndex = 0; const statusEl = document.getElementById('status'), retryButton = document.getElementById('retryButton'), switchCameraButton = document.getElementById('switchCameraButton'), historyList = document.getElementById('historyList'), scanCount = document.getElementById('scanCount'), toast = document.getElementById('toast'), backendUrl = 'https://script.google.com/macros/s/AKfycbxyqt4qTJ7-wNBPU5dK9PaQRlu6txl4l7NaaHbFkKRyntQrnByJCnW09PuY8UNeaEO7rA/exec', historyKey = 'absensi-ekstra-scan-history'; let scanHistory = JSON.parse(localStorage.getItem(historyKey) || '[]');
        function setStatus(message, isError) { statusEl.textContent = message; statusEl.className = 'status' + (isError ? ' error' : '') } function notify(message, isError) { clearTimeout(toastTimer); toast.textContent = message; toast.className = 'toast show' + (isError ? ' error' : ''); toastTimer = setTimeout(() => toast.className = 'toast', 3200) } function escapeHtml(value) { return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char])) } function getData(payload) { try { return JSON.parse(payload) } catch (error) { return {} } } function renderHistory() { scanCount.textContent = scanHistory.length; if (!scanHistory.length) { historyList.innerHTML = '<li class="history-empty">Belum ada data yang dikirim dari perangkat ini.</li>'; return } historyList.innerHTML = scanHistory.map(item => '<li class="history-item"><span class="history-icon">OK</span><div class="history-main"><div class="history-name">' + escapeHtml(item.name) + '</div><div class="history-detail">' + escapeHtml(item.role) + ' - Berhasil dikirim</div></div><span class="history-time">' + item.time + '</span></li>').join('') } function addToHistory(payload) { const data = getData(payload); scanHistory.unshift({ id: String(data.id || payload), name: data.nama || 'QR terbaca', role: data.jabatan || 'Peserta', time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) }); scanHistory = scanHistory.slice(0, 50); localStorage.setItem(historyKey, JSON.stringify(scanHistory)); renderHistory() }
        function enableContinuousFocus() {
            if (!scanner || typeof scanner.applyVideoConstraints !== 'function') return Promise.resolve();
            return scanner.applyVideoConstraints({
                advanced: [{ focusMode: 'continuous' }]
            }).catch(() => {
                // Tidak semua kamera/browser menyediakan kontrol autofocus.
            });
        }
        function startCamera() {
            scanner = new Html5Qrcode('reader');
            return scanner.start(cameras[activeCameraIndex].id, { fps: 10, qrbox: { width: 220, height: 220 } }, onScanSuccess, () => { })
                .then(() => enableContinuousFocus());
        }
        function startScanner() { if (scanning || delivered) return; retryButton.style.display = 'none'; setStatus('Meminta akses kamera...'); Html5Qrcode.getCameras().then(foundCameras => { if (!foundCameras.length) throw new Error('Tidak ada kamera yang terdeteksi.'); cameras = foundCameras; const rearIndex = cameras.findIndex(camera => /back|rear|environment|belakang/i.test(camera.label || '')); activeCameraIndex = rearIndex >= 0 ? rearIndex : 0; switchCameraButton.style.display = cameras.length > 1 ? 'block' : 'none'; return startCamera(); }).then(() => { scanning = true; setStatus('Kamera aktif - arahkan ke QR Code peserta.') }).catch(error => { setStatus('Kamera tidak dapat digunakan: ' + error, true); retryButton.style.display = 'block' }) }
        function switchCamera() { if (!scanning || cameras.length < 2) return; setStatus('Mengganti kamera...'); scanner.stop().then(() => { scanning = false; activeCameraIndex = (activeCameraIndex + 1) % cameras.length; return startCamera(); }).then(() => { scanning = true; setStatus('Kamera aktif - arahkan ke QR Code peserta.'); }).catch(error => { setStatus('Gagal mengganti kamera: ' + error, true); }); }
        function onScanSuccess(decodedText) { if (delivered) return; const data = getData(decodedText), id = String(data.id || decodedText); if (scanHistory.some(item => item.id === id)) { notify((data.nama || 'Peserta ini') + ' sudah dipindai pada perangkat ini.', true); return } delivered = true; scanning = false; if (scanner) scanner.stop().catch(() => { }); setStatus('QR terbaca. Menyimpan presensi...'); fetch(backendUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'recordPresensi', payload: decodedText }) }).then(() => { addToHistory(decodedText); notify((data.nama || 'Peserta') + ' berhasil dikirim ke presensi.'); setStatus('Data berhasil dikirim. Siap scan peserta berikutnya.'); setTimeout(() => { delivered = false; startScanner() }, 1000) }).catch(() => { setStatus('Data gagal dikirim. Periksa koneksi internet lalu coba lagi.', true); notify('Data gagal dikirim. Silakan coba lagi.', true); delivered = false; retryButton.style.display = 'block' }) } renderHistory(); startScanner();
    </script>
</body>

</html>
