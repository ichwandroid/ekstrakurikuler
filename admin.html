<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Admin Scanner - Presensi</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    :root {
      --bg:       #0d0d14;
      --surface:  #15151f;
      --surface2: #1c1c2a;
      --lime:     #c8f731;
      --white:    #ffffff;
      --muted:    rgba(255,255,255,0.45);
      --border:   rgba(255,255,255,0.08);
      --danger:   #ff6b6b;
      --warn:     #ffd166;
    }
    html, body { height:100%; background:var(--bg); font-family:'Inter',system-ui,sans-serif; color:var(--white); overflow-x:hidden; }
    body { display:flex; flex-direction:column; align-items:center; padding:0 0 110px; min-height:100vh; }

    /* FLOATING FIXED BOTTOM DOCK */
    .dock-container {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      margin-left: auto;
      margin-right: auto;
      width: calc(100% - 48px);
      max-width: 360px;
      background: rgba(22, 22, 34, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      z-index: 999;
      opacity: 0;
    }
    .dock-item {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      color: var(--muted);
      text-decoration: none;
      cursor: pointer;
      position: relative;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .dock-item:hover {
      color: var(--white);
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.08);
    }
    .dock-item.active {
      color: var(--lime);
      background: rgba(200, 247, 49, 0.12);
    }
    .dock-item.active::after {
      content: '';
      position: absolute;
      bottom: 4px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 6px var(--lime);
    }

    /* TOP BAR */
    .topbar { width:100%; max-width:430px; display:flex; align-items:center; justify-content:space-between; padding:52px 24px 16px; opacity:0; }
    .topbar-left { display:flex; flex-direction:column; }
    .topbar-badge { display:inline-block; background:rgba(200,247,49,0.12); color:var(--lime); font-size:0.68rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; padding:4px 10px; border-radius:50px; border:1px solid rgba(200,247,49,0.25); margin-bottom:6px; width:fit-content; }
    .topbar-title { font-size:1.1rem; font-weight:700; }
    .topbar-sub { font-size:0.78rem; color:var(--muted); margin-top:2px; }

    /* SCANNER CARD */
    .scanner-card { width:calc(100% - 48px); max-width:382px; background:var(--surface); border-radius:24px; overflow:hidden; border:1px solid var(--border); margin-bottom:16px; opacity:0; }
    .scanner-viewport { position:relative; width:100%; aspect-ratio:1; background:#000; overflow:hidden; }
    #reader { width:100%!important; }
    #reader video { width:100%!important; height:auto!important; display:block; }
    #reader img, #reader canvas { display:none!important; }
    /* override html5-qrcode default UI */
    #reader__scan_region { border:none!important; }
    #reader__dashboard { display:none!important; }

    .scan-overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
    .scan-frame { width:58%; aspect-ratio:1; position:relative; }
    .scan-corner {
      position:absolute;
      width:22px; height:22px;
    }
    .scan-corner.tl { top:0; left:0; border-top:3px solid var(--lime); border-left:3px solid var(--lime); border-radius:4px 0 0 0; }
    .scan-corner.tr { top:0; right:0; border-top:3px solid var(--lime); border-right:3px solid var(--lime); border-radius:0 4px 0 0; }
    .scan-corner.bl { bottom:0; left:0; border-bottom:3px solid var(--lime); border-left:3px solid var(--lime); border-radius:0 0 0 4px; }
    .scan-corner.br { bottom:0; right:0; border-bottom:3px solid var(--lime); border-right:3px solid var(--lime); border-radius:0 0 4px 0; }
    .scan-line { position:absolute; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--lime),transparent); animation:scanMove 2s ease-in-out infinite; border-radius:2px; box-shadow:0 0 8px rgba(200,247,49,0.6); }
    @keyframes scanMove { 0%{top:4%} 50%{top:90%} 100%{top:4%} }
    .scan-dimmer {
      position:absolute; inset:0;
      background:radial-gradient(circle 100px at center, transparent 100%, rgba(13,13,20,0.55) 100%);
    }

    .scanner-footer { padding:16px 20px; display:flex; gap:10px; align-items:center; }
    .scanner-status { flex:1; font-size:0.82rem; color:var(--muted); }
    .scanner-status .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--muted); margin-right:6px; vertical-align:middle; }
    .scanner-status.active .dot { background:var(--lime); animation:blink 1.2s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .btn-sm {
      padding:10px 18px;
      border-radius:12px;
      font-size:0.82rem; font-weight:700;
      cursor:pointer;
      border:none;
      display:flex;
      align-items:center;
      gap:6px;
      transition:transform 0.2s, opacity 0.2s;
    }
    .btn-sm:active { transform:scale(0.96); }
    .btn-start-sm { background:var(--lime); color:#0d0d14; }
    .btn-stop-sm { background:rgba(255,107,107,0.15); color:var(--danger); border:1px solid rgba(255,107,107,0.3); }

    /* LOG SECTION */
    .log-card { width:calc(100% - 48px); max-width:382px; background:var(--surface); border-radius:24px; padding:20px; border:1px solid var(--border); opacity:0; }
    .log-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .log-title { font-size:1rem; font-weight:700; }
    .log-count { background:var(--surface2); color:var(--lime); font-size:0.72rem; font-weight:700; padding:4px 10px; border-radius:50px; }
    .log-list { list-style:none; }
    .log-item { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); }
    .log-item:last-child { border-bottom:none; }
    .log-icon-wrap { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .log-icon-wrap.ok { background:rgba(200,247,49,0.1); color:var(--lime); }
    .log-icon-wrap.err { background:rgba(255,107,107,0.1); color:var(--danger); }
    .log-info { flex:1; min-width:0; }
    .log-name { font-size:0.88rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .log-desc { font-size:0.72rem; color:var(--muted); margin-top:2px; }
    .log-time { font-size:0.72rem; color:var(--muted); white-space:nowrap; }
    .log-empty { text-align:center; color:var(--muted); font-size:0.85rem; padding:24px 0; }

    /* RESULT OVERLAY (Congratulation / Error) */
    .result-overlay {
      display:none;
      position:fixed; inset:0;
      background:var(--bg);
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:32px 24px;
      z-index:200;
    }
    .result-overlay.visible { display:flex; }

    .result-icon-circle {
      width:100px; height:100px;
      border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      margin-bottom:28px;
      position:relative;
    }
    .result-icon-circle.ok { background:rgba(200,247,49,0.12); border:3px solid rgba(200,247,49,0.3); color:var(--lime); }
    .result-icon-circle.err { background:rgba(255,107,107,0.12); border:3px solid rgba(255,107,107,0.25); color:var(--danger); }
    .result-icon-circle::before {
      content:'';
      position:absolute; inset:-12px;
      border-radius:50%;
      border:2px solid transparent;
      animation:rotateRing 3s linear infinite;
    }
    .result-icon-circle.ok::before { border-top-color:var(--lime); }
    .result-icon-circle.err::before { border-top-color:var(--danger); }
    @keyframes rotateRing { to { transform:rotate(360deg); } }

    .result-tag { font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.12em; color:var(--muted); margin-bottom:10px; }
    .result-title { font-size:1.9rem; font-weight:900; text-align:center; margin-bottom:8px; line-height:1.2; }
    .result-subtitle { font-size:0.9rem; color:var(--muted); text-align:center; margin-bottom:32px; line-height:1.6; max-width:280px; }

    .result-data-card { width:100%; max-width:340px; background:var(--surface); border-radius:20px; padding:20px; border:1px solid var(--border); margin-bottom:28px; }
    .result-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); }
    .result-row:last-child { border-bottom:none; }
    .result-key { font-size:0.82rem; color:var(--muted); }
    .result-val { font-size:0.88rem; font-weight:600; text-align:right; }

    .btn-close-result { width:100%; max-width:340px; padding:18px; background:var(--lime); border:none; border-radius:18px; color:#0d0d14; font-size:1rem; font-weight:800; cursor:pointer; letter-spacing:0.04em; text-transform:uppercase; box-shadow:0 8px 24px rgba(200,247,49,0.25); transition:transform 0.2s; display:flex; align-items:center; justify-content:center; gap:8px; }
    .btn-close-result:hover { transform:translateY(-2px); }

    /* PROCESSING */
    .processing-overlay { display:none; position:fixed; inset:0; background:rgba(13,13,20,0.9); backdrop-filter:blur(10px); align-items:center; justify-content:center; flex-direction:column; gap:20px; z-index:300; }
    .processing-overlay.visible { display:flex; }
    .spinner-ring { width:60px; height:60px; border-radius:50%; border:4px solid var(--surface2); border-top-color:var(--lime); animation:spin 0.8s linear infinite; box-shadow:0 0 20px rgba(200,247,49,0.2); }
    @keyframes spin { to { transform:rotate(360deg); } }
    .processing-label { font-size:0.9rem; font-weight:600; color:var(--lime); letter-spacing:0.04em; }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="topbar" id="topbar">
    <div class="topbar-left">
      <span class="topbar-badge">Mode Admin</span>
      <div class="topbar-title">QR Scanner</div>
      <div class="topbar-sub">Pindai QR Code peserta</div>
    </div>
    <div style="width:42px;height:42px;background:rgba(200,247,49,0.12);border-radius:14px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(200,247,49,0.2);color:var(--lime);">
      <i data-lucide="scan-line" style="width:22px;height:22px;"></i>
    </div>
  </div>

  <!-- SCANNER -->
  <div class="scanner-card" id="scannerCard">
    <div class="scanner-viewport">
      <div id="reader"></div>
      <div class="scan-overlay">
        <div class="scan-frame">
          <div class="scan-corner tl"></div>
          <div class="scan-corner tr"></div>
          <div class="scan-corner bl"></div>
          <div class="scan-corner br"></div>
          <div class="scan-line"></div>
        </div>
      </div>
      <div class="scan-dimmer"></div>
    </div>
    <div class="scanner-footer">
      <div class="scanner-status" id="scanStatus">
        <span class="dot"></span>Kamera belum aktif
      </div>
      <button class="btn-sm btn-start-sm" id="btnStart" onclick="startScanner()">
        <i data-lucide="play" style="width:14px;height:14px;"></i>
        <span>Mulai</span>
      </button>
      <button class="btn-sm btn-stop-sm" id="btnStop" onclick="stopScanner()" style="display:none;">
        <i data-lucide="square" style="width:14px;height:14px;"></i>
        <span>Stop</span>
      </button>
    </div>
  </div>

  <!-- LOG CARD -->
  <div class="log-card" id="logCard">
    <div class="log-header">
      <span class="log-title">Riwayat Hari Ini</span>
      <span class="log-count" id="logCount">0</span>
    </div>
    <ul class="log-list" id="logList">
      <li class="log-empty">Belum ada scan hari ini</li>
    </ul>
  </div>

  <!-- RESULT OVERLAY -->
  <div class="result-overlay" id="resultOverlay">
    <div class="result-icon-circle" id="resultIcon"></div>
    <div class="result-tag" id="resultTag"></div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-subtitle" id="resultSubtitle"></div>
    <div class="result-data-card" id="resultDataCard" style="display:none;"></div>
    <button class="btn-close-result" onclick="closeResult()">
      <i data-lucide="refresh-cw" style="width:18px;height:18px;"></i>
      <span>Scan Lagi</span>
    </button>
  </div>

  <!-- PROCESSING -->
  <div class="processing-overlay" id="processingOverlay">
    <div class="spinner-ring"></div>
    <div class="processing-label">Memverifikasi QR Code...</div>
  </div>

  <!-- FLOATING FIXED BOTTOM DOCK -->
  <div class="dock-container" id="bottomDock">
    <a href="#" class="dock-item" title="Beranda" onclick="event.preventDefault(); setActiveDock(this);">
      <i data-lucide="rocket" style="width:20px;height:20px;"></i>
    </a>
    <a href="#" class="dock-item" title="Kotak Masuk" onclick="event.preventDefault(); setActiveDock(this);">
      <i data-lucide="inbox" style="width:20px;height:20px;"></i>
    </a>
    <a href="#" class="dock-item active" title="Scanner" onclick="event.preventDefault(); setActiveDock(this);">
      <i data-lucide="network" style="width:20px;height:20px;"></i>
    </a>
    <a href="#" class="dock-item" title="Modul" onclick="event.preventDefault(); setActiveDock(this);">
      <i data-lucide="package" style="width:20px;height:20px;"></i>
    </a>
    <a href="#" class="dock-item" title="Statistik" onclick="event.preventDefault(); setActiveDock(this);">
      <i data-lucide="trending-up" style="width:20px;height:20px;"></i>
    </a>
  </div>

  <script>
    let html5QrCode = null;
    let isScanning  = false;
    let isProcessing= false;
    const scanLog   = [];

    lucide.createIcons();

    // Entrance
    anime.timeline({ easing:'easeOutExpo' })
      .add({ targets:'#topbar', opacity:[0,1], translateY:[-16,0], duration:500 })
      .add({ targets:'#scannerCard', opacity:[0,1], translateY:[20,0], duration:600 }, '-=300')
      .add({ targets:'#logCard', opacity:[0,1], translateY:[20,0], duration:500 }, '-=200')
      .add({ targets:'#bottomDock', opacity:[0,1], translateY:[20,0], duration:600 }, '-=200');

    function setActiveDock(el) {
      document.querySelectorAll('.dock-item').forEach(function(item) { item.classList.remove('active'); });
      el.classList.add('active');
    }

    function startScanner() {
      if (isScanning) return;
      html5QrCode = new Html5Qrcode('reader');
      html5QrCode.start(
        { facingMode:'environment' },
        { fps:10, qrbox:{ width:200, height:200 } },
        onScanSuccess,
        function(){}
      ).then(function() {
        isScanning = true;
        document.getElementById('btnStart').style.display = 'none';
        document.getElementById('btnStop').style.display  = 'inline-flex';
        const st = document.getElementById('scanStatus');
        st.className = 'scanner-status active';
        st.innerHTML = '<span class="dot"></span>Kamera aktif — siap scan';
      }).catch(function(err) {
        alert('Tidak dapat mengakses kamera: ' + err);
      });
    }

    function stopScanner(silent) {
      if (html5QrCode && isScanning) {
        html5QrCode.stop().then(function() {
          isScanning = false;
          if (!silent) {
            document.getElementById('btnStart').style.display = 'inline-flex';
            document.getElementById('btnStop').style.display  = 'none';
            const st = document.getElementById('scanStatus');
            st.className = 'scanner-status';
            st.innerHTML = '<span class="dot"></span>Kamera dihentikan';
          }
        });
      }
    }

    function onScanSuccess(decoded) {
      if (isProcessing) return;
      isProcessing = true;
      stopScanner(true);
      document.getElementById('processingOverlay').classList.add('visible');

      google.script.run
        .withSuccessHandler(onServerResponse)
        .withFailureHandler(onServerError)
        .recordPresensi(decoded);
    }

    function onServerResponse(result) {
      document.getElementById('processingOverlay').classList.remove('visible');

      const overlay   = document.getElementById('resultOverlay');
      const iconEl    = document.getElementById('resultIcon');
      const tagEl     = document.getElementById('resultTag');
      const titleEl   = document.getElementById('resultTitle');
      const subtitleEl= document.getElementById('resultSubtitle');
      const dataCard  = document.getElementById('resultDataCard');

      if (result.success) {
        iconEl.className = 'result-icon-circle ok';
        iconEl.innerHTML = '<i data-lucide="check" style="width:48px;height:48px;"></i>';
        tagEl.textContent = 'Presensi Berhasil';
        titleEl.textContent = 'Congratulations!';
        subtitleEl.textContent = result.message + '\nData presensi berhasil dicatat.';
        const d = result.data;
        dataCard.style.display = 'block';
        dataCard.innerHTML =
          '<div class="result-row"><span class="result-key">Nama</span><span class="result-val">' + d.nama + '</span></div>' +
          '<div class="result-row"><span class="result-key">Jabatan</span><span class="result-val">' + (d.jabatan||'-') + '</span></div>' +
          '<div class="result-row"><span class="result-key">Waktu</span><span class="result-val">' + d.waktu + '</span></div>' +
          '<div class="result-row"><span class="result-key">Status</span><span class="result-val" style="color:var(--lime)">' + d.status + '</span></div>';
        addToLog(d.nama, true, d.jabatan);
      } else {
        iconEl.className = 'result-icon-circle err';
        iconEl.innerHTML = '<i data-lucide="x" style="width:48px;height:48px;"></i>';
        tagEl.textContent = 'Presensi Gagal';
        titleEl.textContent = 'Scan Ditolak';
        subtitleEl.textContent = result.message;
        dataCard.style.display = 'none';
        addToLog(result.message, false, '');
      }

      overlay.classList.add('visible');
      lucide.createIcons();
      anime({ targets: '#resultOverlay > *', opacity:[0,1], translateY:[20,0], duration:600, delay:anime.stagger(60), easing:'easeOutExpo' });
      isProcessing = false;
    }

    function onServerError(err) {
      document.getElementById('processingOverlay').classList.remove('visible');
      onServerResponse({ success:false, message:'Error koneksi: ' + (err.message||err) });
    }

    function closeResult() {
      const overlay = document.getElementById('resultOverlay');
      anime({
        targets: '#resultOverlay > *',
        opacity:[1,0],
        translateY:[0,10],
        duration:300,
        easing:'easeInQuad',
        complete:function() {
          overlay.classList.remove('visible');
          // Reset scanner UI
          document.getElementById('btnStart').style.display = 'inline-flex';
          document.getElementById('btnStop').style.display  = 'none';
          const st = document.getElementById('scanStatus');
          st.className = 'scanner-status';
          st.innerHTML = '<span class="dot"></span>Kamera belum aktif';
          startScanner();
        }
      });
    }

    function addToLog(name, ok, desc) {
      const now  = new Date();
      const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
      scanLog.unshift({ name, ok, desc, time });
      renderLog();
    }

    function renderLog() {
      const list = document.getElementById('logList');
      document.getElementById('logCount').textContent = scanLog.length;
      if (!scanLog.length) {
        list.innerHTML = '<li class="log-empty">Belum ada scan hari ini</li>';
        return;
      }
      list.innerHTML = scanLog.slice(0,10).map(function(item) {
        const iconName = item.ok ? 'check' : 'x';
        return '<li class="log-item">' +
          '<div class="log-icon-wrap ' + (item.ok?'ok':'err') + '"><i data-lucide="' + iconName + '" style="width:18px;height:18px;"></i></div>' +
          '<div class="log-info">' +
            '<div class="log-name">' + item.name + '</div>' +
            '<div class="log-desc">' + (item.ok ? (item.desc||'Presensi berhasil') : 'Gagal diproses') + '</div>' +
          '</div>' +
          '<span class="log-time">' + item.time + '</span>' +
        '</li>';
      }).join('');
      lucide.createIcons();
    }
  </script>
</body>
</html>
